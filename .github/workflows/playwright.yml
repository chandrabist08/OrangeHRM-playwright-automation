name: Playwright Tests
# when to run the workflow
on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]


# what to do when the workflow is triggered
jobs:
  verify:
    name: Verify harness
    runs-on: ubuntu-latest # Spins up a clean Linux virtual machine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run verify
        run: npm run verify
        env:
          ENV: qa
          BASE_URL: ${{ secrets.QA_BASE_URL }}
          API_BASE_URL: ${{ secrets.QA_API_BASE_URL }}
          API_TOKEN: ${{ secrets.QA_API_TOKEN }}
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ADMIN_AUTH_STATE: playwright/storage/auth/admin.json
          PW_RETRIES: 2
          CI: true
      - uses: actions/upload-artifact@v4
        if: always()  # Saves report whether tests pass or fail
        with:
          name: evidence
          path: evidence/
          retention-days: 14
